name: Build EffectCraft Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust & Android Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set Up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Cache Build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      - name: Scaffold Android Crate
        run: |
          mkdir -p apps/effectcraft-android/src

          EFRAME_VER=$(grep -E '^eframe\s*=' Cargo.toml | sed -E 's/.*version\s*=\s*"([^"]+)".*/\1/' || echo "0.36")

          cat <<EOF > apps/effectcraft-android/Cargo.toml
          [package]
          name = "effectcraft-android"
          version.workspace = true
          edition.workspace = true
          license.workspace = true

          [lib]
          name = "effectcraft_android"
          crate-type = ["cdylib"]

          [dependencies]
          effectcraft-engine = { workspace = true }
          effectcraft-host = { workspace = true }
          effectcraft-ui-egui = { workspace = true }
          egui = { workspace = true }
          eframe = { version = "${EFRAME_VER}", default-features = false, features = [
              "default_fonts",
              "wgpu",
              "android-game-activity",
          ] }
          wgpu = { workspace = true }
          serde_json = { workspace = true }
          rayon = { workspace = true }
          log = { workspace = true }
          android_logger = "0.15"
          winit = { version = "0.30", default-features = false, features = ["android-game-activity"] }

          [package.metadata.android]
          package = "com.artcraft.effectcraft"
          label = "EffectCraft"
          apk_name = "effectcraft"
          build_targets = ["aarch64-linux-android"]
          fullscreen = true
          orientation = "sensorLandscape"

          [package.metadata.android.sdk]
          min_sdk_version = 28
          target_sdk_version = 34

          [[package.metadata.android.uses_feature]]
          name = "android.hardware.vulkan.level"
          required = false
          version = 1
          EOF

          cat <<'EOF' > apps/effectcraft-android/src/lib.rs
          #![cfg(target_os = "android")]

          use effectcraft_ui_egui::EffectcraftApp;
          use egui::{FontFamily, FontId, Style, TextStyle, Vec2};
          use serde_json::json;
          use winit::platform::android::activity::AndroidApp;

          #[unsafe(no_mangle)]
          fn android_main(app: AndroidApp) {
              android_logger::init_once(
                  android_logger::Config::default()
                      .with_max_level(log::LevelFilter::Info)
                      .with_tag("EffectCraft"),
              );

              // Cap Rayon workers to avoid mobile thermal throttling
              let worker_threads = std::thread::available_parallelism()
                  .map(|n| (n.get() / 2).clamp(2, 4))
                  .unwrap_or(3);
              let _ = rayon::ThreadPoolBuilder::new()
                  .num_threads(worker_threads)
                  .thread_name(|i| format!("ec-worker-{i}"))
                  .build_global();

              let native_options = eframe::NativeOptions {
                  android_app: Some(app),
                  renderer: eframe::Renderer::Wgpu,
                  ..Default::default()
              };

              let _ = eframe::run_native(
                  "EffectCraft",
                  native_options,
                  Box::new(move |cc| {
                      // egui 0.36 style mutation
                      let mut style = (*cc.egui_ctx.style()).clone();
                      configure_android_touch_style(&mut style);
                      cc.egui_ctx.set_style(style);

                      let mut session = effectcraft_host::session();
                      let _ = session.execute(
                          "comp.new",
                          json!({
                              "name": "Mobile Comp",
                              "width": 1280,
                              "height": 720,
                              "fps": 30.0,
                              "duration": 5.0
                          }),
                      );

                      let ec_app = EffectcraftApp::new(session);
                      Ok(Box::new(ec_app))
                  }),
              );
          }

          fn configure_android_touch_style(style: &mut Style) {
              style.spacing.interact_size = Vec2::new(44.0, 34.0);
              style.spacing.item_spacing = Vec2::new(8.0, 6.0);
              style.spacing.button_padding = Vec2::new(10.0, 6.0);
              style.spacing.scroll.bar_width = 12.0;
              style.spacing.scroll.handle_min_length = 32.0;
              style.spacing.scroll.floating = false;
              style.text_styles.insert(
                  TextStyle::Body,
                  FontId::new(14.5, FontFamily::Proportional),
              );
              style.text_styles.insert(
                  TextStyle::Button,
                  FontId::new(14.5, FontFamily::Proportional),
              );
          }
          EOF

      - name: Build and Sign APK
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo apk build -p effectcraft-android --release

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)

          keytool -genkey -v -keystore release.keystore \
            -alias effectcraft -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=EffectCraft,O=ArtCraft,C=US"

          mkdir -p dist
          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "target/release/apk/effectcraft.apk" "dist/aligned.apk"
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks release.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "dist/effectcraft-android-signed.apk" \
            "dist/aligned.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EffectCraft-Android-ARM64-APK
          path: dist/effectcraft-android-signed.apk
          retention-days: 14
